name: 自动发布
run-name: 发布 ${{ github.ref_name }}

on:
  push:
    tags:
      - '[vV][0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# 串行发布，避免不同版本交错覆盖两端的 latest；不中断正在推送的版本。
concurrency:
  group: ghcr-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: 检出触发 Tag 的提交
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 校验版本并提取更新日志
        id: version
        shell: bash
        run: |
          python3 .github/scripts/release.py prepare --tag "$RELEASE_TAG" --notes "$RUNNER_TEMP/release-notes.md"
          echo "version=${RELEASE_TAG:1}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: 登录 GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: src/MyTranslator.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.version.outputs.image_prefix }}-api:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image_prefix }}-api:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: src/MyTranslator.Web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.version.outputs.image_prefix }}-web:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image_prefix }}-web:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: python3 .github/scripts/release.py publish --tag "$RELEASE_TAG" --notes "$RUNNER_TEMP/release-notes.md"
