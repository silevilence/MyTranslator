server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Include the standard types in this scope before extending them for ES modules.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;

    # FileTaskService allows 10 MiB; leave room for multipart form overhead.
    client_max_body_size 12m;

    gzip_static on;
    gzip_vary on;
    # RCL assets use fixed filenames: revalidate resources after deployments.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Docker's embedded DNS resolves the new address after API container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:8080;

    # Preserve the original URI (including /api) and query string.
    # Keep API errors and Swagger responses out of the SPA fallback.
    location ~ ^/(api|swagger)(/|$) {
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Missing boot resources must be 404, never an HTML response with status 200.
    location /_framework/ {
        try_files $uri =404;
    }

    location /_content/ {
        try_files $uri =404;
    }

    location ~* \.(css|js|mjs|json|wasm|webcil|dll|pdb|dat|blat|gz|br|map|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|otf|webmanifest)$ {
        try_files $uri =404;
    }

    # Blazor handles routes such as /login, /settings and /tasks/{id}.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
