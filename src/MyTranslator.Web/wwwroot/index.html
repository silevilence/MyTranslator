<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTranslator</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="_content/MyTranslator.Shared/css/mt.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="_content/MyTranslator.Shared/MyTranslator.Shared.bundle.scp.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MyTranslator.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        <!-- 启动壳文案无法走 resx：Blazor 尚未启动，IStringLocalizer 不可用（审查项已知，静态壳例外） -->
        <span class="blazor-error-text">应用运行出错</span>
        <a href="." class="reload">重新加载</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MyTranslator.Shared/js/storage.js"></script>
    <script src="_content/MyTranslator.Shared/js/download.js"></script>
    <script src="_content/MyTranslator.Shared/js/dialog.js"></script>
    <script src="_content/MyTranslator.Shared/js/editor.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
