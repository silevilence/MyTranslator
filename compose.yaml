name: mytranslator

services:
  api:
    image: mytranslator-api:local
    build:
      context: .
      dockerfile: src/MyTranslator.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Data Source=/data/mytranslator.db"
      INITIAL_TOKEN: "${INITIAL_TOKEN:?Set INITIAL_TOKEN in .env or the shell before starting}"
    volumes:
      - sqlite-data:/data
    restart: unless-stopped

  web:
    image: mytranslator-web:local
    build:
      context: .
      dockerfile: src/MyTranslator.Web/Dockerfile
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  sqlite-data:
