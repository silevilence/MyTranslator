name: mytranslator

services:
  api:
    image: ghcr.io/silevilence/mytranslator-api:${IMAGE_TAG:-latest}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Data Source=/data/mytranslator.db"
      INITIAL_TOKEN: "${INITIAL_TOKEN:?Set INITIAL_TOKEN in .env or the shell before starting}"
    volumes:
      - sqlite-data:/data
    restart: unless-stopped

  web:
    image: ghcr.io/silevilence/mytranslator-web:${IMAGE_TAG:-latest}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  sqlite-data:
